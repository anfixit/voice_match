name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.16
          python-version: '3.12'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: |
          set -o pipefail
          uv run mypy src 2>&1 | tee mypy.log

      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mypy-diagnostics
          path: mypy.log
          retention-days: 1

      - name: Tests
        run: uv run pytest

      - name: Export locked dependencies
        run: uv export --frozen --no-hashes --output-file requirements-audit.txt

      - name: Audit dependencies
        run: |
          uvx --from pip-audit pip-audit \
            --strict \
            --requirement requirements-audit.txt

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Build image
        run: docker build --progress=plain --tag voice-match:ci .
