[project]
name = 'voice-match'
version = '0.2.0'
description = 'Research baseline for transparent speaker embedding comparison'
readme = 'README.md'
license = {text = 'Apache-2.0'}
requires-python = '>=3.12'
authors = [
    {name = 'Анфиса Ковганюк', email = 'anfisa.kov@yahoo.com'},
]
dependencies = [
    'torch>=2.13.0,<2.14',
    'torchaudio>=2.13.0,<2.14',
    'speechbrain>=1.0.0,<2.0',
    'librosa>=0.10.2',
    'soundfile>=0.12.1',
    'pydub>=0.25.1',
    'webrtcvad>=2.0.10',
    'numpy>=1.26.0,<2.0.0',
    'matplotlib>=3.9.0',
    'gradio>=6.20.0,<7',
    'pydantic-settings>=2.14.2,<3',
    'setuptools>=83.0.0,<84',
    'click>=8.3.3',
    'idna>=3.15',
    'msgpack>=1.2.1',
    'pillow>=12.3.0',
    'pygments>=2.20.0',
    'python-dotenv>=1.2.2',
    'python-multipart>=0.0.31',
    'requests>=2.33.0',
    'starlette>=1.3.1',
    'urllib3>=2.7.0',
]
[project.optional-dependencies]
dev = [
    'mypy>=1.11.0',
    'pytest>=9.0.3',
    'pytest-cov>=5.0.0',
    'ruff>=0.5.0',
]

[project.scripts]
voice-match = 'voice_match.__main__:main'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/voice_match']

[tool.ruff]
target-version = 'py312'
line-length = 79

[tool.ruff.lint]
select = [
    'B',
    'E',
    'F',
    'I',
    'N',
    'S',
    'UP',
    'W',
]
ignore = [
    'RUF001',
    'RUF002',
    'RUF003',
]

[tool.ruff.lint.isort]
known-first-party = ['voice_match']
force-single-line = false

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['S101', 'S105']

[tool.mypy]
python_version = '3.12'
strict = true
disallow_any_generics = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ['tests']
python_files = ['test_*.py']
python_functions = ['test_*']
addopts = [
    '--cov=src/voice_match',
    '--cov-report=term-missing',
    '--cov-fail-under=70',
    '-q',
    '--tb=short',
]
